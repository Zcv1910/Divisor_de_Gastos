<div class="page">
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div>
        <h1 class="title">Divisor de Gastos</h1>
        <p class="subtitle">Split expenses, settle fairly</p>
      </div>
      <button class="reset-btn" onclick="resetAll()">Reset</button>
    </div>

    <!-- Members Section -->
    <div class="section">
      <p class="section-label"><input type="text" name="GroupName" id="GroupName" placeholder="Add a Group Name" oninput="saveGroupName()"></p>
      <div class="chips" id="member-chips"></div>
      <div class="input-row">
        <input id="member-input" placeholder="Name..." maxlength="30" style="max-width:200px" />
        <button class="btn btn-ghost" onclick="addMember()">+ Add</button>
      </div>
      <p class="error-msg" id="member-error" style="display:none"></p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('expenses', this)">Expenses</button>
      <button class="tab" onclick="switchTab('balances', this)">Balances</button>
      <button class="tab" onclick="switchTab('settle', this)">Settle Up</button>
    </div>

    <div class="tab-panel active" id="tab-expenses">
      <div class="section">
        <p class="section-label">Add expense</p>
        <div id="add-form-locked" class="empty-msg" style="display:none">Add at least two members first.</div>
          <div id="add-form-fields">
            <div class="input-stack">
              <select name="exp-cate" id="exp-cate" onchange="toggleOtherOption()" class="input-full">
                <option value="Tickets">Tickets</option>
                <option value="Food">Food</option>
                <option value="Transportation">Transportation</option>
                <option value="Housing">Housing</option>
                <option value="Shopping">Shopping</option>
                <option value="Others">Others</option>
              </select>

              <input type="text" name="Other-Option" id="Other-Option" placeholder="Name your category" class="input-full" style="display:none;" />

              <input id="exp-desc" placeholder="What was it? (e.g. Dinner)" maxlength="60" class="input-full" />

              <div class="amount-wrap input-full">
                <span class="currency-prefix">RM</span>
                <input id="exp-amount" class="amount-input" placeholder="0.00" type="number" min="0" step="0.01" />
              </div>
            </div>

            <div class="input-row" style="margin-top:10px">
              <span class="inline-label">Paid by</span>
              <select id="exp-payer"></select>
              <span class="inline-label">split equally</span>
            </div>

            <p class="error-msg" id="exp-error" style="display:none"></p>
            <div style="display:flex;justify-content:flex-end;margin-top:12px">
              <button class="btn btn-accent" onclick="addExpense()">Add expense</button>
            </div>
          </div>
    </div>

      <div class="section">
        <div class="section-header">
          <p class="section-label" style="margin:0">Expense log</p>
          <span class="section-header-right" id="expense-total"></span>
        </div>
        <div id="expense-list"><p class="empty-msg">No expenses yet.</p></div>
      </div>
    </div>

    <!-- Balances Tab -->
    <div class="tab-panel" id="tab-balances">
      <div class="metrics" id="metrics-grid"></div>
      <div class="section">
        <p class="section-label">Net balances</p>
        <div id="balance-list"><p class="empty-msg">Add some expenses to see balances.</p></div>
      </div>
    </div>

    <!-- Settle Up Tab -->
    <div class="tab-panel" id="tab-settle">
      <div class="section">
        <div class="section-header">
          <p class="section-label" style="margin:0">Settle up</p>
          <span class="section-header-right" id="settle-count"></span>
        </div>
        <div id="settle-list"></div>
      </div>

      <button class="btn btn-ghost" onclick="exportToCsv()">Export History</button>
    </div>

  </div>
</div>

<script src="SplitterMainFunc.js"></script>
</body>
</html>
